# This home's configuration FOR the kit. Lives OUTSIDE memory-kit/, so a pull cannot clobber it.
# Shape: plain YAML, read by the lint.

# Which memory directory this home uses.
memory_dir: memory

# gate  = fail closed (exit 1). The default for a fresh home: a new tree passes everything.
# gauge = report only (exit 0). For an existing home adopting the kit, until the debt clears.
# A gate must pass on the tree it is introduced to; a lint that fails on day one teaches
# --no-verify, and the kit is finished here.
mode: gate

# Shipped rules this home has disabled, each with a reason. Mandatory rules cannot be
# disabled -- a home cannot opt out of knowing where its own kit comes from.
# The lint REPORTS a divergence; it never forbids one.
disabled_shipped_rules: []
  # - rule: "Never write a number you had to carry by hand. Write the command that derives it."
  #   reason: ""
  #   ruled: ""
